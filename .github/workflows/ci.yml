name: CI

on:
  push:
    branches: [main, sprint-01-foundation, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check live DEV Lambda patch safety (offline)
        run: python3 -m unittest discover -s tests -p "test_lambda_patch.py" -v

      - name: Test MCP tool permissions and assistant parity
        run: node --experimental-strip-types --test tests/ai-mcp-tools.test.mjs

      - name: Test cross-column Dropbox ID guard
        run: node --test tests/dropbox-identity.test.mjs

      - name: Validate Step 9 Windows PowerShell setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-readonly-clients.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: Step 9 PowerShell script parses"

      - name: Validate ChatGPT OAuth config helper PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-chatgpt-oauth-config.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: ChatGPT OAuth configuration script parses"

      - name: Validate ChatGPT PRIVATE credential helper PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-chatgpt-private-client.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: ChatGPT private credential helper parses"

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build web app
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
