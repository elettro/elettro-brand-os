name: CI

on:
  push:
    branches: [main, sprint-01-foundation, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check live DEV Lambda patch safety (offline)
        run: python3 -m unittest discover -s tests -p "test_lambda_patch.py" -v

      - name: Test MCP tool permissions and assistant parity
        run: node --experimental-strip-types --test tests/ai-mcp-tools.test.mjs tests/ar-gateway.test.mjs

      - name: Test per-user brand access
        run: node --experimental-strip-types --test tests/brand-access.test.mjs

      - name: Test scroll relay (phone remote for elettro.com/scroll)
        run: node --test tests/scroll-relay.test.mjs

      - name: Test AI Lambda (Bedrock relay for the dev-api)
        run: node --test tests/ai-lambda.test.mjs

      - name: Test asset metadata state and enrichment guards
        run: node --test tests/asset-enrichment-safety.test.mjs

      - name: Test ChatGPT upload verification and brand lookup
        run: node --test tests/chatgpt-upload-and-lookup.test.cjs

      - name: Validate Dropbox brand-root migration
        run: node --test tests/brand-root-routing.test.cjs tests/brand-root-migration.test.mjs tests/shared-audio-library.test.cjs tests/shared-stock-graphics.test.cjs tests/document-assets.test.mjs tests/asset-tagging.test.mjs

      - name: Test Claude transfer and folder operations
        run: node --test tests/claude-transfer-and-folders.test.cjs tests/claude-folder-relay.test.mjs

      - name: Test cross-column Dropbox ID guard
        run: node --test tests/dropbox-identity.test.mjs

      - name: Test Planner V2, curator and intelligence budgets
        run: node --test tests/planner-v2.test.mjs tests/planner-sector-tags.test.mjs tests/carousels.test.mjs tests/copy-and-song-facts.test.mjs tests/product-links-backfill.test.mjs tests/plan-month.test.mjs

      - name: Test connection status feed and LinkedIn connect
        run: node --test tests/connection-status.test.mjs tests/gmb-connect.test.mjs tests/linkedin-connect.test.mjs tests/mastodon-connect.test.mjs tests/snapchat-connect.test.mjs tests/substack-connect.test.mjs tests/x-connect.test.mjs tests/reddit-connect.test.mjs tests/x-worker.test.mjs tests/api-gate.test.mjs tests/dev-api-zip-contents.test.mjs tests/client-scope.test.cjs

      - name: Test YouTube upload worker and publishing loop
        run: node --test tests/youtube-upload.test.mjs tests/planner-topup.test.mjs tests/posting-times.test.mjs tests/planner-ops.test.mjs tests/merge-duplicate-accounts.test.mjs tests/brand-create.test.mjs tests/dashboard-stats.test.mjs tests/planner-review.test.mjs tests/calendar.test.mjs tests/holidays.test.mjs tests/multicam.test.mjs tests/link-tracking.test.mjs tests/post-metrics.test.mjs tests/post-metrics-audit.test.mjs tests/metrics-correctness.test.mjs tests/metrics-verify.test.mjs tests/analytics.test.mjs tests/performance.test.mjs tests/planner-changes.test.mjs tests/time-tests.test.mjs tests/weekly-check.test.mjs tests/post-why.test.mjs tests/social-metrics.test.mjs tests/linkedin-metrics.test.mjs tests/ops-tick.test.mjs tests/plan-runs.test.mjs

      - name: Test Elettro AR admin API
        run: node --experimental-strip-types --test tests/post-eta.test.mjs tests/ar-api.test.mjs tests/ar-viewer.test.mjs tests/ar-console.test.mjs tests/ar-compile.test.mjs tests/ar-e2e.test.mjs

      - name: Test TikTok and Threads connect and token refresh
        run: node --test tests/tiktok-connect.test.mjs tests/tiktok-refresh.test.mjs tests/pinterest-connect.test.mjs tests/pinterest-worker.test.mjs tests/threads-connect.test.mjs tests/threads-refresh.test.mjs tests/bluesky-connect.test.mjs tests/bluesky-worker.test.mjs tests/mastodon-worker.test.mjs tests/snapchat-worker.test.mjs tests/substack-worker.test.mjs tests/meta-worker.test.mjs tests/linkedin-worker.test.mjs tests/linkedin-pages.test.mjs tests/linkedin-document.test.mjs tests/linkedin-custom.test.mjs tests/gmb-worker.test.mjs tests/gmb-planner.test.mjs tests/posting-window.test.mjs tests/connection-disconnect.test.mjs

      - name: Validate Step 9 Windows PowerShell setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-readonly-clients.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: Step 9 PowerShell script parses"

      - name: Validate ChatGPT OAuth config helper PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-chatgpt-oauth-config.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: ChatGPT OAuth configuration script parses"

      - name: Validate ChatGPT PRIVATE credential helper PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/step9-chatgpt-private-client.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: ChatGPT private credential helper parses"

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build web app
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
