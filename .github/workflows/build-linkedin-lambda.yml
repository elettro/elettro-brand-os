name: Build LinkedIn Lambda

on:
  push:
    branches:
      - develop
    paths:
      - "services/linkedin-lambda/**"
      - ".github/workflows/build-linkedin-lambda.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/linkedin-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check syntax
        run: node --check index.mjs

      - name: Package Lambda
        run: zip -r elettro-brand-os-dev-linkedin.zip index.mjs package.json

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: elettro-brand-os-dev-linkedin
          path: services/linkedin-lambda/elettro-brand-os-dev-linkedin.zip
          if-no-files-found: error
