name: Build DEV API Lambda

on:
  push:
    branches:
      - develop
    paths:
      - "services/dev-api-lambda/**"
      - "intelligence/**"
      - ".github/workflows/build-dev-api-lambda.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dev-api-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production dependencies
        run: npm install --omit=dev --workspaces=false

      - name: Package Lambda
        run: node --check index.mjs && node --check dropbox-upload-session.mjs && node --check dropbox-identity.mjs && node --check claude-folder-ops.mjs && node --check brand-root-migration.mjs && node --check brand-media-reset.mjs && node --check shared-audio-library.mjs && node --check planner-v2.mjs && node --check planner-v2-db.mjs && node --check publishing-formats.mjs && node --check curator.mjs && node --check intelligence.mjs && node --check song-facts.mjs && node --check copywriter.mjs && node --check connection-status.mjs && node --check youtube-connect.mjs && node --check linkedin-connect.mjs && node --check meta-connect.mjs && node --check threads-connect.mjs && node --check tiktok-connect.mjs && node --check pinterest-connect.mjs && node --check planner-review.mjs && node --check library-publications.mjs && node --check planner-ops.mjs && rm -rf intelligence && cp -r ../../intelligence ./intelligence && zip -r elettro-brand-os-dev-api.zip index.mjs db-main.mjs dropbox-upload-session.mjs dropbox-identity.mjs claude-folder-ops.mjs brand-root-migration.mjs brand-media-reset.mjs planner-v2.mjs planner-v2-db.mjs publishing-formats.mjs curator.mjs intelligence.mjs song-facts.mjs copywriter.mjs intelligence connection-status.mjs youtube-connect.mjs linkedin-connect.mjs meta-connect.mjs threads-connect.mjs tiktok-connect.mjs pinterest-connect.mjs planner-review.mjs library-publications.mjs planner-ops.mjs shared-audio-library.mjs init.sql node_modules package.json

      - name: Verify packaged handler loads
        run: node --input-type=module -e 'await import("./index.mjs")'

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: elettro-brand-os-dev-api
          path: services/dev-api-lambda/elettro-brand-os-dev-api.zip
          if-no-files-found: error

