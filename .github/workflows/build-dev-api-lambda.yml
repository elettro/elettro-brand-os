name: Build DEV API Lambda

on:
  push:
    branches:
      - develop
    paths:
      - "services/dev-api-lambda/**"
      - ".github/workflows/build-dev-api-lambda.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dev-api-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production dependencies
        run: npm install --omit=dev --workspaces=false

      - name: Package Lambda
        run: node --check index.mjs && node --check dropbox-upload-session.mjs && node --check dropbox-identity.mjs && node --check claude-folder-ops.mjs && node --check brand-root-migration.mjs && node --check brand-media-reset.mjs && zip -r elettro-brand-os-dev-api.zip index.mjs db-main.mjs dropbox-upload-session.mjs dropbox-identity.mjs claude-folder-ops.mjs brand-root-migration.mjs brand-media-reset.mjs init.sql node_modules package.json

      - name: Verify packaged handler loads
        run: node --input-type=module -e 'await import("./index.mjs")'

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: elettro-brand-os-dev-api
          path: services/dev-api-lambda/elettro-brand-os-dev-api.zip
          if-no-files-found: error

