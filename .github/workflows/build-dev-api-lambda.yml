name: Build DEV API Lambda

on:
  push:
    branches:
      - develop
    paths:
      - "services/dev-api-lambda/**"
      - ".github/workflows/build-dev-api-lambda.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dev-api-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Package Lambda
        run: zip -r elettro-brand-os-dev-api.zip index.mjs node_modules package.json

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: elettro-brand-os-dev-api
          path: services/dev-api-lambda/elettro-brand-os-dev-api.zip
          if-no-files-found: error
