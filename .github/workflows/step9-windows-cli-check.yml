name: Step 9 Windows Claude MCP CLI Compatibility
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/step9-windows-cli-check.yml'
      - 'scripts/step9-fix-claude-code-windows.ps1'
      - 'scripts/step9-connect-claude-windows.ps1'

jobs:
  windows-claude-mcp:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code 2.1.299
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code@2.1.299 --no-audit --no-fund
      - name: Verify direct user-scope MCP configuration with backup (no credentials)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          claude --version
          $localDir=Join-Path $env:LOCALAPPDATA 'ElettroMCP'
          New-Item -ItemType Directory -Force -Path $localDir | Out-Null
          Copy-Item -LiteralPath './scripts/step9-readonly-clients.ps1' -Destination (Join-Path $localDir 'step9-readonly-clients.ps1')
          Set-Content -Path (Join-Path $localDir 'claude_code.dpapi') -Value 'dummy-never-decrypted'
          $original = [pscustomobject]@{
            numStartups = 2
            installMethod = 'npm'
            nonAscii = 'café'
            mcpServers = [pscustomobject]@{
              existing = [pscustomobject]@{type='http';url='https://example.invalid/mcp'}
            }
          }
          $config = Join-Path $HOME '.claude.json'
          [System.IO.File]::WriteAllText($config, ($original | ConvertTo-Json -Depth 50), (New-Object System.Text.UTF8Encoding($false)))
          & powershell -NoProfile -ExecutionPolicy Bypass -File './scripts/step9-fix-claude-code-windows.ps1' -Action Install
          if ($LASTEXITCODE -ne 0) { throw 'Step 9 local config installation failed' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File './scripts/step9-fix-claude-code-windows.ps1' -Action Verify
          if ($LASTEXITCODE -ne 0) { throw 'Step 9 local config verification failed' }
          $cfg=Get-Content -Raw -Encoding UTF8 -LiteralPath $config | ConvertFrom-Json
          if ($cfg.numStartups -ne 2 -or $cfg.nonAscii -ne 'café' -or $cfg.mcpServers.existing.url -ne 'https://example.invalid/mcp') { throw 'Existing config was not preserved' }
          if ($cfg.mcpServers.'elettro-dev'.type -ne 'http' -or $cfg.mcpServers.'elettro-dev'.headersHelper -notlike '*EmitCodeHeaders*') { throw 'New MCP entry invalid' }
          $backups=@(Get-ChildItem -LiteralPath $HOME -Filter '.claude.json.elettro-step9-backup-*.json')
          if ($backups.Count -ne 1) { throw 'Expected exactly one safety backup' }
          Write-Host 'PASS: user config preserved, encrypted helper referenced, backup present, no raw token.'
          & powershell -NoProfile -ExecutionPolicy Bypass -File './scripts/step9-fix-claude-code-windows.ps1' -Action Install
          if ($LASTEXITCODE -ne 0) { throw 'Second install was not idempotent' }
          claude mcp get elettro-dev
          if ($LASTEXITCODE -ne 0) { throw 'Claude Code could not read the configured MCP entry' }
          Write-Host 'PASS: Claude Code 2.1.299 recognizes the secure Windows MCP configuration.'
